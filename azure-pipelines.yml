# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- azure-pipelines

resources:
- repo: self

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: 'My pc'
      demands:
        - Agent.Name -equals R
    steps:
    - task: CmdLine@2
    - script: |
        echo "Building Docker image..."
        docker build ./myapp -t $(IMAGE_NAME)
      displayName: Docker Build
    
    - script: |
        cp ./myapp/pom.xml ./myapp/backup_pom.xml
        docker create --name temp $(IMAGE_NAME)
        docker cp temp:/app/pom.xml ./myapp/pom.xml
        docker rm temp
      displayName: backup_pom

    - powershell: |
        $version = mvn help:evaluate "-Dexpression=project.version" -q -DforceStdout -f myapp/pom.xml
        $version = $version.Trim()
        Write-Host "Detected JAR version: $version"
        Write-Host "##vso[task.setvariable variable=JAR_VERSION]$version"
      displayName: "Set JAR_VERSION variable (Windows)"

    - script: |
        docker tag $(IMAGE_NAME) $(DOCKER_HUB_USERNAME)/$(REPO_NAME):$(JAR_VERSION)
        docker tag $(IMAGE_NAME) $(DOCKER_HUB_USERNAME)/$(REPO_NAME):latest
      displayName:  tag_image

    - task: Docker@2
      displayName: "Push Docker image"
      inputs:
        containerRegistry: 'docker_login'
        repository: '$(DOCKER_HUB_USERNAME)/$(REPO_NAME)'
        command: 'push'
        tags: |
          $(JAR_VERSION)
          latest

    - script: 
       docker run --rm $(DOCKER_HUB_USERNAME)/$(REPO_NAME):$(JAR_VERSION)
      displayName: "check_img"