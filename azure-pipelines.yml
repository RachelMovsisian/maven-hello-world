trigger:
- azure-pipelines

resources:
- repo: self

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: 'My pc'
      demands:
        - Agent.Name -equals R
    steps:
    - task: Maven@4
      displayName: "Get JAR version"
      inputs:
        mavenPomFile: "myapp/pom.xml"
        goals: "help:evaluate"
        options: "-Dexpression=project.version -q -DforceStdout"
        publishJUnitResults: false
      continueOnError: false

    - powershell: |
        $version = mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f myapp/pom.xml
        Write-Host "Detected JAR version: $version"
        Write-Host "##vso[task.setvariable variable=JAR_VERSION]$version"
      displayName: "Set JAR_VERSION variable (Windows)"

    - script: |
        echo "Using project version: $(JAR_VERSION)"
      displayName: "Use version"
