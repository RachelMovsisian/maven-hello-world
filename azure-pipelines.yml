# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- azure-pipelines

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: 'My pc'
      demands:
        - Agent.Name -equals R
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'docker_login'
        repository: 'justme2024/azure_maven'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'